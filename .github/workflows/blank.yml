name: Deploy API
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # generated Prisma is gitignored; tsc also chokes on Prisma's TS4094
      - run: npm ci && npx prisma generate
      - uses: appleboy/ssh-action@v1.2.0
        env:
          PORT: ${{ secrets.PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PORT,JWT_SECRET,APP_URL,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,MAIL_FROM,DATABASE_URL
          script: |
            set -e
            cd /var/www/club-portal-backend
            git pull origin main
            npm ci
            npx prisma generate
            missing=
            for name in JWT_SECRET APP_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY MAIL_FROM DATABASE_URL; do
              eval "val=\$$name"
              if [ -z "$val" ]; then
                missing="$missing $name"
              fi
            done
            if [ -n "$missing" ]; then
              echo "missing GitHub Actions secrets:$missing"
              exit 1
            fi
            umask 077
            {
              echo "PORT=${PORT:-4000}"
              echo "JWT_SECRET=$JWT_SECRET"
              echo "APP_URL=$APP_URL"
              echo "AWS_REGION=${AWS_REGION:-ap-south-1}"
              echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
              echo "MAIL_FROM=$MAIL_FROM"
              echo "DATABASE_URL=$DATABASE_URL"
            } > .env
            pm2 restart club-api || pm2 start "npx tsx src/server.ts" --name club-api
